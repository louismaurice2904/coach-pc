name: Sauvegarde quotidienne Supabase

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Créer le dossier de sauvegarde
        run: mkdir -p backups

      - name: Exécuter la sauvegarde
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          pg_dump "$DATABASE_URL" --no-owner --no-acl > backups/backup-$DATE.sql
          gzip backups/backup-$DATE.sql

      - name: Supprimer les sauvegardes de plus de 30 jours
        run: |
          find backups/ -name "*.sql.gz" -mtime +30 -delete

      - name: Envoyer la sauvegarde sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "Sauvegarde automatique $(date +'%Y-%m-%d')" || echo "Rien à sauvegarder"
          git push